# Claude Code.
#
# Identidade sai do GLIFO INICIAL, não do nome do produto. Medido em
# 2026-08-24: o título é `✳ Claude Code` antes do primeiro turno e vira
# `✳ Echo alo` depois dele — ele carrega o resumo do turno, e "Claude" some
# exatamente quando a sessão passa a ter algo a dizer. O glifo é o que fica.
#
# Limitação conhecida: `title` casa por substring, não por início de linha, e o
# motor não tem "começa com". Um título que contenha o glifo no meio casaria.
# Aceito porque glifo em título é raro; se um dia colidir, a saída é acrescentar
# o modo ao motor, não afrouxar isto.
id = "claude-code"
min_engine_version = 2
applies_to = ["shell", "ssh", "container"]

match = { process = ["claude"], title = ["✳ ", "◐ ", "◑ ", "✻ "] }

# Trabalhando: o spinner alterna entre as duas metades.
[[rules]]
id = "title_working"
state = "running"
priority = 1000
region = "osc_title"
line_regex = '^[◐◑]\s'

# `✳` e `✻`: o MESMO glifo, dois significados, decididos pelo escopo.
#
# Dentro do tmux o Claude trava o título em `✳` (medido: com `$TMUX` visível ele
# nunca anima), então lá o glifo aparece igual parado e trabalhando — e ler
# aquilo como ocioso marcaria de parado um agente ativo, justamente no público
# da feature de SSH.
#
# No shell local não há tmux no meio (o TYBA roda com `env -u TMUX`), o spinner
# anima de verdade, e `✳` parado é exatamente o repouso. Ler como "não mexa"
# ali deixa a linha travada em "rodando" para sempre depois do primeiro turno —
# afirmação falsa, e falsa do lado pior: você acha que ele trabalha quando na
# verdade ele te espera.
#
# Antes de `applies_to` por regra (motor v2) sobrava escolher qual dos dois
# errar.
[[rules]]
id = "title_idle_local"
state = "idle"
priority = 900
region = "osc_title"
line_regex = '^[✳✻]\s'
applies_to = ["shell"]

[[rules]]
id = "title_identified_no_state"
priority = 890
region = "osc_title"
line_regex = '^[✳✻]\s'
applies_to = ["ssh", "container"]
skip_state_update = true
