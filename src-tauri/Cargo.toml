[package]
name = "tyba"
version = "0.8.1"
description = "TYBA — seu ambiente, tudo conectado. Terminal orientado a agentes."
authors = ["TYBA contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.9"
anyhow = "1"
parking_lot = "0.12"
base64 = "0.22"
thiserror = "2"
regex = "1"
fuzzy-matcher = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
vt100 = "0.15"
percent-encoding = "2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
sha2 = "0.10"
trash = "5"
toml = "0.8"
toml_edit = "0.20"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "blocking"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

# Ícone do Dock em tempo de execução (`app_icon`). Já vêm do tao; aqui só as
# features que o `NSApplication.applicationIconImage` e o selo do `NSDockTile`
# pedem.
#
# Navegador nativo do Orbit (`orbit::browser`, Fase 5): o `wry` direto, na
# MESMA versão do `tauri-runtime-wry` (um teste confere que o Cargo.lock tem
# um só), e as partes do WebKit/AppKit que ele não expõe (delegate de UI,
# monitor de eventos, print).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSArray", "NSURL", "NSURLRequest", "NSError", "NSGeometry", "NSProcessInfo", "NSValue", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSDockTile", "NSView", "NSWindow", "NSEvent", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "block2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin", "WKOpenPanelParameters", "WKNavigationAction", "WKNavigation", "WKWindowFeatures", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKContentWorld", "WKUserScript", "WKUserContentController"] }
block2 = "0.6"
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "os-webview"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
# Navegador nativo do Orbit no Linux (`orbit::browser::linux`): o mesmo `wry`
# do Tauri e o WebKitGTK por baixo dele (mundo isolado, permissões, teclado,
# print). Versões iguais às do wry; `v2_40` o Tauri já liga (`linux-body`).
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "os-webview"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1.2"
gtk = "0.18"

# Navegador nativo do Orbit no Windows (`orbit::browser::windows`): o mesmo
# `wry` do Tauri e o WebView2 por baixo dele (permissões, frames internos,
# teclado e o DevTools pela API para o mundo isolado). Versões já no lock.
[target.'cfg(windows)'.dependencies]
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "os-webview"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_JobObjects",
] }

[lib]
name = "tyba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
portable-pty = "0.9"
ctor = "0.8"
