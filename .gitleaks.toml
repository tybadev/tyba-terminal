[extend]
useDefault = true

# Os testes de redação precisam de tokens com a FORMA real pra provar que o
# redator os pega — e o gitleaks, corretamente, os encontra. Todos são valores
# sintéticos: sequências de abcdef/0123456789, o `AKIAIOSFODNN7EXAMPLE` da própria
# doc da AWS e o JWT de exemplo do jwt.io (`sub: 1234567890`).
#
# Allowlist por VALOR, nunca por arquivo: um segredo de verdade colado nesses
# mesmos arquivos continua sendo pego.
[allowlist]
description = "fixtures sintéticas dos testes de redação"
regexes = [
  '''gh[pousr]_(abcdefghijklmnopqrstuvwxyz|ABCDEFGHIJKLMNOPQRSTUVWXYZ)0123456789''',
  '''glpat-abcdefghij1234567890''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''sk-abcdef1234567890ABCDEFghijkl''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.''',
]
