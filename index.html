<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Tyba</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #050505;
      }
      @media (prefers-color-scheme: light) {
        html,
        body,
        #root {
          background: #f5f5f7;
        }
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: inherit;
        opacity: 1;
        transition: opacity 220ms ease-out;
      }
      #splash[data-hidden="true"] {
        opacity: 0;
      }
      #splash img {
        width: 96px;
        height: 96px;
        animation: splash-in 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash img {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/splash-icon.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
