<!doctype html>
<!--
  Splash do arranque: janela própria (label `splash`, ver tauri.conf.json e
  src-tauri/src/splash.rs), mostrada enquanto a janela principal e o core
  sobem. Sem rede. Tema: o salvo no core, que chega por public/splash-boot.js
  (o único JavaScript daqui); sem ele, o `prefers-color-scheme` do sistema.
  Movimento pelo `prefers-reduced-motion`, fontes do bundle.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Tyba</title>
    <script src="/splash-boot.js"></script>
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body>
    <main class="splash" aria-busy="true">
      <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="arc-top" x1="15.3" y1="4.5" x2="48.7" y2="4.5" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7dc242" />
            <stop offset="1" stop-color="#f2bb0f" />
          </linearGradient>
          <linearGradient id="arc-right" x1="58.1" y1="12.3" x2="58.1" y2="46.8" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f8bb10" />
            <stop offset="1" stop-color="#6c9d1a" />
          </linearGradient>
          <linearGradient id="arc-left" x1="5.8" y1="12.3" x2="5.8" y2="46.8" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1fab4e" />
            <stop offset="1" stop-color="#008d84" />
          </linearGradient>
          <linearGradient id="wave-hi" x1="11.8" y1="53.6" x2="52.2" y2="53.6" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0179d4" />
            <stop offset="0.5" stop-color="#00a2c4" />
            <stop offset="1" stop-color="#0179d4" />
          </linearGradient>
          <linearGradient id="wave-lo" x1="18.7" y1="59.6" x2="45.3" y2="59.6" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#04408e" />
            <stop offset="0.5" stop-color="#0658a8" />
            <stop offset="1" stop-color="#04408e" />
          </linearGradient>
          <linearGradient id="core" x1="32" y1="25.4" x2="32" y2="33.4" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#c3d95f" />
            <stop offset="1" stop-color="#46a175" />
          </linearGradient>
        </defs>
        <g stroke-width="3.8" stroke-linecap="round" fill="none">
          <path d="M15.3 4.5 Q32 31.6 48.7 4.5" stroke="url(#arc-top)" />
          <path d="M58.1 12.3 Q36.9 29.3 58.1 46.8" stroke="url(#arc-right)" />
          <path d="M5.8 12.3 Q27.1 29.3 5.8 46.8" stroke="url(#arc-left)" />
          <path d="M11.8 53.6 Q32 25.8 52.2 53.6" stroke="url(#wave-hi)" />
          <path d="M18.7 59.6 Q32 38.7 45.3 59.6" stroke="url(#wave-lo)" />
        </g>
        <circle cx="32" cy="29.4" r="4.05" fill="url(#core)" />
      </svg>
      <h1 class="wordmark">TYBA</h1>
      <div class="filament" role="progressbar" aria-label="Carregando"></div>
      <p class="status">restaurando sessões…</p>
    </main>
  </body>
</html>
