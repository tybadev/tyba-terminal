name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the artifacts without publishing a release"
        type: boolean
        default: true
      platforms:
        description: "Which platforms to build/release"
        type: choice
        default: all
        options: [all, linux, macos]

# Least privilege. The default used to be `contents: write` for EVERY job — the
# test jobs could publish a release. Now nothing writes unless it says so, and only
# the publish job says so.
permissions:
  contents: read

jobs:
  # A tag can point at any commit, not just a green main — so the release runs the
  # gates itself instead of trusting that someone else already did.
  gates:
    uses: ./.github/workflows/gates.yml

  # The version lives in three manifests. If the tag says v0.2.0 and they still say
  # 0.1.0, Tauri happily builds `Tyba_0.1.0.dmg` and publishes it under the v0.2.0
  # release — the kind of mismatch nobody notices until a user reports it.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The JOB must always run. A job-level `if` makes it SKIP on a dry run, and
      # `build` (which needs it) skips in cascade — a green run that built nothing.
      # Only the check is tag-scoped.
      - name: Tag must match the manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          for got in "$conf" "$pkg" "$cargo"; do
            if [ "$got" != "$tag" ]; then
              echo "::error::version mismatch: tag is $tag but a manifest says $got"
              exit 1
            fi
          done

  # Linux must be able to ship without macOS. The macOS build needs the Apple
  # certificate to produce something installable (an unsigned .dmg exists, but
  # Gatekeeper calls it "damaged"), and waiting on Apple should not hold the Linux
  # release hostage. So the matrix itself is computed — filtering by `if` inside the
  # job would still leave a failed/blocked job that `publish` waits on.
  matrix:
    needs: [gates, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          # A tag push carries no input, so it falls back to the repo variable —
          # which is what lets a tag ship Linux while the Apple certificate does
          # not exist yet. Set RELEASE_PLATFORMS=all once it does. Without this,
          # `git push --tags` would always build macOS, fail for lack of a
          # certificate, and take the Linux release down with it.
          PLATFORMS: ${{ inputs.platforms || vars.RELEASE_PLATFORMS || 'all' }}
        run: |
          set -euo pipefail
          # `environment` sai daqui porque a trava de revisor protege UMA coisa: a
          # chave de assinatura. O macOS abre o cofre (certificado Developer ID), o
          # Linux não abre nada — a procedência dele vem de OIDC, que é efêmero e
          # não é secret. Fazer o Linux esperar aprovação era pedágio sem proteção.
          mac='{"os":"macos-latest","target":"aarch64-apple-darwin","label":"macos-apple-silicon","environment":"release"},
               {"os":"macos-latest","target":"x86_64-apple-darwin","label":"macos-intel","environment":"release"}'
          # 22.04 pins the oldest glibc we support: a binary linked against a newer
          # glibc will not run on an older distro, while the reverse always works.
          linux='{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"linux-x86_64","environment":"release-unsigned"}'
          case "$PLATFORMS" in
            linux) include="[$linux]" ;;
            macos) include="[$mac]" ;;
            *)     include="[$mac,$linux]" ;;
          esac
          include=$(echo "$include" | tr -d '\n' | tr -s ' ')
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "$include"

  build:
    needs: [gates, version, matrix]
    # O environment vem da matriz. `release` guarda o certificado da Apple e exige
    # revisor humano; `release-unsigned` não guarda secret nenhum e não exige. Os
    # dois recusam rodar fora de `main` e de tag `v*`.
    #
    # O que a trava protege é a CHAVE: sem revisor, uma action de terceiro
    # sequestrada assinaria um binário em nome do dono. Quando o Windows ganhar
    # certificado, ele entra em `release` pelo mesmo motivo.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      # Provenance attestation: cryptographic proof that these bytes came from this
      # repo, this workflow and this commit. It is how an artifact that did NOT come
      # out of CI gets caught.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Deps de sistema (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils não é opcional: o bundler do AppImage chama xdg-open e aborta
          # sem ele — o .deb e o .rpm saem, o AppImage não.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev rpm xdg-utils

      - run: bun install --frozen-lockfile

      # Signed build — tags only, because tags are the only path that publishes.
      # Without the certificate, Gatekeeper marks the app as "damaged" and nobody
      # can open it; the verification step below refuses to publish an unsigned
      # artifact. Loud failure beats a release nobody can install.
      - name: Build, signed (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}

      # Dry run: build WITHOUT the signing env. Passing empty certificate variables
      # makes tauri-action try to import a null certificate and die
      # (`SecKeychainItemImport: parameters not valid`) — which is precisely what
      # the first rehearsal caught. An unsigned build can never be published: the
      # publish job only runs on tags, and on tags the signature is verified.
      - name: Build, unsigned (macOS, dry run)
        if: startsWith(matrix.os, 'macos') && !startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          args: --target ${{ matrix.target }}

      - name: Build (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          args: --target ${{ matrix.target }}

      # O bundler do Tauri não gera tarball. Ele existe para quem não quer
      # gerenciador de pacote nem AppImage — joga o binário em ~/.local/bin e pronto.
      # Mora dentro de bundle/ de propósito: é o diretório que o checksum, a
      # attestation e o upload varrem.
      - name: Tarball do binário (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          rel=src-tauri/target/${{ matrix.target }}/release
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          if [ ! -x "$rel/tyba" ]; then
            echo "::error::binário não encontrado em $rel/tyba"
            exit 1
          fi
          mkdir -p "$rel/bundle/tarball"
          tar -czf "$rel/bundle/tarball/tyba-${ver}-linux-x86_64.tar.gz" -C "$rel" tyba
          ls -la "$rel/bundle/tarball"

      # Enforced on tags — which is the only path that publishes. A dry run
      # (workflow_dispatch) skips it on purpose: without the certificate the app is
      # ad-hoc signed and Gatekeeper rejects it, and we still want to be able to
      # rehearse the pipeline before the certificate exists. Publishing an unsigned
      # build stays impossible.
      - name: Verify signature and notarization (macOS)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)
          echo "app: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # spctl é o veredito real do Gatekeeper: assinado E notarizado.
          if ! spctl --assess --type execute --verbose=4 "$app"; then
            echo "::error::app rejeitado pelo Gatekeeper — não assinado ou não notarizado"
            exit 1
          fi

      - name: Verify the Linux artifacts
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          # O bundler do AppImage falha sozinho (ex.: xdg-open ausente) enquanto o
          # .deb e o .rpm saem normalmente — sem esta checagem o release publicaria
          # dois formatos de três e ninguém notaria.
          for fmt in deb rpm appimage tarball; do
            find "$bundle/$fmt" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) \
              | grep -q . || { echo "::error::formato $fmt não foi gerado"; exit 1; }
          done
          # bubblewrap precisa vir declarado: sem ele o spawn de agente é recusado
          # fail-closed, e o usuário só descobriria isso na primeira sessão.
          deb=$(find "$bundle/deb" -name '*.deb' | head -1)
          dpkg-deb -f "$deb" Depends | grep -q bubblewrap \
            || { echo "::error::o .deb não declara bubblewrap"; exit 1; }

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          find . -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) \
            -exec shasum -a 256 {} \; > SHA256SUMS-${{ matrix.label }}.txt
          cat SHA256SUMS-${{ matrix.label }}.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/tarball/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tyba-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/tarball/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS-*.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job in the whole pipeline allowed to write to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt

          # Globbing os quatro formatos direto no comando quebra o release que não
          # tem todos eles: sem macOS na matriz não há .dmg, o glob não expande, e
          # o `gh` morre com "no such file" — derrubando justamente a publicação
          # Linux-first que a matriz computada existe para permitir.
          #
          # E o find é RECURSIVO de propósito: o upload-artifact preserva a estrutura
          # do bundler, então os instaladores chegam em artifacts/deb/, artifacts/rpm/
          # e artifacts/appimage/ — nunca soltos na raiz. Só o SHA256SUMS fica no topo.
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(
            find artifacts -type f \
              \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) \
              | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::nenhum instalador nos artefatos — não há o que publicar"
            exit 1
          fi
          files+=(artifacts/SHA256SUMS.txt)
          printf 'publicando: %s\n' "${files[@]}"

          # `--generate-notes` cola títulos de PR. Título de PR é para quem revisa
          # código; quem chega na página do release quer saber o que instalar e
          # como. O changelog de verdade mora no site, e é para lá que a app aponta.
          # O nome do arquivo vem do bundler (Tyba_0.1.0_amd64.deb, T maiúsculo) —
          # montá-lo à mão a partir da versão erra o comando de instalação.
          name_of() { printf '%s\n' "${files[@]}" | grep -m1 "$1" | xargs -r basename; }
          deb=$(name_of '\.deb$'); rpm=$(name_of '\.rpm$'); app=$(name_of '\.AppImage$')
          tgz=$(name_of '\.tar\.gz$')

          {
            echo "O TYBA é um terminal orientado a agentes: sessões de agente em git"
            echo "worktrees isolados, cada uma dentro de uma jaula do sistema, com toda"
            echo "ação de risco passando por uma inbox de aprovação."
            echo
            echo "**O que mudou:** https://tyba.dev/pt-br/changelog"
            echo "**Baixar:** https://tyba.dev/pt-br/download"
            echo
            echo "## Instalar"
            echo
            if [ -n "$deb" ]; then
              echo '```bash'
              echo "# Debian, Ubuntu e derivados"
              echo "sudo apt install ./$deb"
              echo '```'
            fi
            if [ -n "$rpm" ]; then
              echo '```bash'
              echo "# Fedora, RHEL e derivados"
              echo "sudo dnf install ./$rpm"
              echo '```'
            fi
            if [ -n "$app" ]; then
              echo '```bash'
              echo "# Qualquer distro, sem instalar"
              echo "chmod +x $app && ./$app"
              echo '```'
            fi
            if [ -n "$tgz" ]; then
              echo '```bash'
              echo "# Binário cru, sem gerenciador de pacote"
              echo "tar -xzf $tgz && install -Dm755 tyba ~/.local/bin/tyba"
              echo '```'
            fi
            if printf '%s\n' "${files[@]}" | grep -q '\.dmg$'; then
              echo "**macOS**: baixe o \`.dmg\` da sua arquitetura (Apple Silicon ou Intel)."
              echo
            fi
            echo
            echo "> O \`.deb\` e o \`.rpm\` declaram **bubblewrap** como dependência: sem ele o"
            echo "> core recusa a sessão de agente em vez de rodar sem jaula. Com o AppImage"
            echo "> ou o tarball, instale \`bubblewrap\` pelo gerenciador da sua distro — senão"
            echo "> o TYBA abre e a sessão de agente é recusada."
            echo
            echo "## Verificar o que você baixou"
            echo
            echo "Todo binário sai da CI com checksum e **atestação de procedência assinada"
            echo "pelo GitHub** — a prova de que ele saiu deste repositório, deste commit,"
            echo "por este workflow."
            echo
            echo '```bash'
            echo "gh attestation verify <arquivo> --repo ${GITHUB_REPOSITORY}"
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo '```'
          } > notes.md

          cat notes.md

          # Rascunho de propósito: o dono confere os artefatos e publica na mão.
          # E `create` só na primeira vez: quando o certificado da Apple chegar, o
          # macOS é anexado a ESTA release — um segundo `create` na mesma tag falha
          # com "release already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Anexar o macOS depois muda a lista de instaladores, então as notas
            # são reescritas junto — senão a página continuaria só com o Linux.
            gh release upload "${GITHUB_REF_NAME}" --clobber "${files[@]}"
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "TYBA ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              "${files[@]}"
          fi
