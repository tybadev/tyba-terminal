name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # O repo nasceu para ser opensource: quando abrir, o histórico inteiro vai
  # junto. Secret commitado hoje é secret vazado no dia do lançamento — o gate
  # varre o histórico completo, não só o diff.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A gitleaks-action exige licença paga em repo de ORGANIZAÇÃO (é grátis só
      # em repo pessoal) — o gate morria antes de varrer qualquer coisa. O binário
      # é o mesmo e não pede licença.
      - name: gitleaks (histórico completo)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Instalar deps de sistema do Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev bubblewrap python3
      # ubuntu-latest é 24.04, que bloqueia user namespace sem privilégio via
      # AppArmor. Sem isto o bwrap não sobe e os testes do sandbox Linux passariam
      # SKIPADOS — CI verde sem ter exercitado a jaula é pior que CI vermelha.
      - name: Habilitar user namespaces sem privilégio (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
