name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gates live in one place (gates.yml) and are called from here and from the
# release. Duplicating the steps meant a fix to one copy silently left the other
# behind — and the copy that mattered most, the release, had no gates at all.
jobs:
  gates:
    uses: ./.github/workflows/gates.yml
