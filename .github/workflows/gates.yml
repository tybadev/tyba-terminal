name: Gates

# Single definition of the gates. Called by:
#   - ci.yml on pull requests  -> blocks the merge
#   - ci.yml on push to main   -> catches breakage that only shows up once two
#                                 independently-green PRs are merged together
#   - release.yml on a tag     -> blocks PUBLISHING an untested binary
#
# A tag does not come from main by definition — it comes from whatever commit it
# points at. Without the gates here, `git tag` would publish a release that never
# ran a single test.
on:
  workflow_call:

jobs:
  # The repo is public: the whole history is already clonable. A secret committed
  # today is a secret leaked today — so the scan covers the full history, not the
  # diff.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # gitleaks-action requires a paid license on ORGANIZATION repos (it is free
      # only on personal ones) — the job died before scanning anything. The binary
      # is the same tool and needs no license.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      # A security-first product that never checks its own dependencies for known
      # CVEs is telling on itself. Fails the build on any advisory.
      - run: bun audit
      - run: bun run typecheck
      - run: bun test

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
      - name: Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev bubblewrap python3
      # ubuntu-latest is 24.04, which blocks unprivileged user namespaces through
      # AppArmor. Without this, bwrap cannot start and the Linux sandbox tests
      # would SKIP — a green CI that never exercised the cage is worse than a red
      # one.
      - name: Enable unprivileged user namespaces (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        if: matrix.os != 'windows-latest'
        working-directory: src-tauri

      # Windows compila e linka, mas o binário de teste não SOBE
      # (STATUS_ENTRYPOINT_NOT_FOUND — issue #163), então nenhum teste jamais
      # rodou lá. `--no-run` cobre o que dá para cobrir hoje e é deliberadamente
      # menos que as outras plataformas. Quando a #163 fechar: voltar para
      # `cargo test` e apagar estes dois `if`.
      - run: cargo test --no-run
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri

      # Same reasoning as `bun audit`, on the Rust side. Exceptions live in
      # src-tauri/.cargo/audit.toml — each one dated and justified, never a blanket
      # ignore. Anything not listed there fails.
      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --quiet
          cargo audit
        working-directory: src-tauri

  # Gate de integridade dos pins de LSP gerenciado + a prova viva do LSP na jaula.
  # Baixa os artefatos EXATOS dos pins, confere o sha256 de cada byte e sobe os
  # servers gerenciados (nativo e node) na jaula real de cada plataforma. É o
  # único lugar onde o LSP-no-bwrap é exercido de ponta a ponta.
  lsp-pins:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Sandbox deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Baixar pins, verificar sha256 e subir na jaula
        run: cargo test --lib live_managed_ -- --ignored --nocapture
        working-directory: src-tauri
